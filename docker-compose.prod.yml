# docker-compose.prod.yml

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recovery_engine}
      POSTGRES_USER: ${POSTGRES_USER:-recovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recovery} -d ${POSTGRES_DB:-recovery_engine}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recovery_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recovery-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recovery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recovery_engine}

      NEBIUS_API_KEY: ${NEBIUS_API_KEY:?NEBIUS_API_KEY must be set}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:?NEBIUS_BASE_URL must be set}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/Nemotron-3_5-Lightning}

      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DATABASE_PATH: /data/recovery.db

      SHADOW_MODE: ${SHADOW_MODE:-true}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
      ENABLE_PERSISTENCE: ${ENABLE_PERSISTENCE:-false}
      ENABLE_WEBHOOK_INGRESS: ${ENABLE_WEBHOOK_INGRESS:-false}
      ENABLE_APPROVAL_GATE: ${ENABLE_APPROVAL_GATE:-false}
      ENABLE_BLOCK_ESCALATION: ${ENABLE_BLOCK_ESCALATION:-false}
      ENABLE_SANDBOX_HARDENING: ${ENABLE_SANDBOX_HARDENING:-false}
      ENABLE_AUTO_MERGE: ${ENABLE_AUTO_MERGE:-false}
      ENABLE_POST_MERGE_VERIFY: ${ENABLE_POST_MERGE_VERIFY:-false}
      ENABLE_REAL_METRICS: ${ENABLE_REAL_METRICS:-false}
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-false}
      ENABLE_TAVILY_RESEARCH: ${ENABLE_TAVILY_RESEARCH:-false}
      ENABLE_FORK_AND_PR: ${ENABLE_FORK_AND_PR:-false}
      ENABLE_LLM_CACHE: ${ENABLE_LLM_CACHE:-false}
      ENABLE_BENCHMARK_VIEW: ${ENABLE_BENCHMARK_VIEW:-false}
      ENABLE_DEMO_SCENARIOS: ${ENABLE_DEMO_SCENARIOS:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - are_data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - recovery_internal
      - recovery_public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: recovery-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - recovery_public

volumes:
  postgres_data:
  are_data:

networks:
  recovery_internal:
    driver: bridge
    internal: true

  recovery_public:
    driver: bridge
